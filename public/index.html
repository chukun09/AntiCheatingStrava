<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng ký Giải Chạy IRIS - Vạn Dặm Vươn Xa</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden selection:bg-orange-500 selection:text-white">

  <!-- Background Decorative Glowing Orbs -->
  <div class="absolute top-1/4 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-orange-600/20 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute bottom-1/4 right-10 w-80 h-80 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>

  <div class="max-w-md w-full bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 my-6">
    
    <!-- Header Logo & Title -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-2xl shadow-lg shadow-orange-500/20 mb-4">
        <svg class="w-9 h-9 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      </div>
      <h1 class="text-2xl font-extrabold text-white tracking-tight">HÀNH TRÌNH IRIS 2026</h1>
      <p class="text-xs font-semibold text-amber-400 uppercase tracking-widest mt-1">VẠN DẶM VƯƠN XA - KỶ NIỆM 15 NĂM</p>
    </div>

    <!-- Onboarding Form -->
    <form action="/auth/strava-link" method="POST" class="space-y-5">
      
      <!-- Nickname Input -->
      <div>
        <label for="nickName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Nickname định danh Strava <span class="text-orange-500">*</span>
        </label>
        <input 
          type="text" 
          id="nickName" 
          name="nickName" 
          required 
          placeholder="Ví dụ: Nam_Rapper_IT" 
          class="w-full px-4 py-3.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition duration-200"
        />
        <p class="text-[11px] text-slate-400 mt-1.5">Đặt trùng khớp với tên tài khoản Strava đã đăng ký với BTC.</p>
      </div>

      <!-- Gender Input (Nam / Nữ) -->
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Giới tính <span class="text-orange-500">*</span>
        </label>
        <div class="grid grid-cols-2 gap-3">
          <label class="flex items-center justify-center space-x-2 p-3 bg-slate-800/80 border border-slate-700/80 rounded-xl cursor-pointer hover:border-orange-500/50 transition">
            <input type="radio" name="gender" value="MALE" checked class="text-orange-500 focus:ring-orange-500">
            <span class="text-sm font-medium text-white">👨 Nam (30km)</span>
          </label>
          <label class="flex items-center justify-center space-x-2 p-3 bg-slate-800/80 border border-slate-700/80 rounded-xl cursor-pointer hover:border-orange-500/50 transition">
            <input type="radio" name="gender" value="FEMALE" class="text-orange-500 focus:ring-orange-500">
            <span class="text-sm font-medium text-white">👩 Nữ (15km)</span>
          </label>
        </div>
      </div>

      <!-- Team Selection (08 Đội thi) -->
      <div>
        <label for="teamId" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Chọn Đội Thi Đấu <span class="text-orange-500">*</span>
        </label>
        <select 
          id="teamId" 
          name="teamId" 
          required 
          class="w-full px-4 py-3.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition duration-200"
        >
          <option value="1">Đội 1: Kỹ thuật vận hành</option>
          <option value="2">Đội 2: Phát triển phần mềm</option>
          <option value="3">Đội 3: Chăm sóc khách hàng</option>
          <option value="4">Đội 4: Kinh doanh</option>
          <option value="5">Đội 5: Kế toán + Sản phẩm</option>
          <option value="6">Đội 6: HCNS + Đối soát + Lái xe</option>
          <option value="7">Đội 7: VP HCM + Phát triển kd</option>
          <option value="8">Đội 8: HĐQT + BGĐ + Trợ lý</option>
        </select>
      </div>

      <!-- Full Name Input -->
      <div>
        <label for="fullName" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Họ và Tên
        </label>
        <input 
          type="text" 
          id="fullName" 
          name="fullName" 
          placeholder="Ví dụ: Nguyễn Văn Nam" 
          class="w-full px-4 py-3.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition duration-200"
        />
      </div>

      <!-- Department Input -->
      <div>
        <label for="department" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Phòng Ban Chi Tiết
        </label>
        <input 
          type="text" 
          id="department" 
          name="department" 
          placeholder="Ví dụ: Phòng IT - Backend Team" 
          class="w-full px-4 py-3.5 bg-slate-800/80 border border-slate-700/80 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20 transition duration-200"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-4 px-6 bg-[#FC4C02] hover:bg-[#e34402] text-white font-bold text-base rounded-xl shadow-lg shadow-orange-600/30 flex items-center justify-center space-x-2 transition duration-200 transform active:scale-[0.99]"
      >
        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
          <path d="M15.387 17.944l-2.089-4.116h-3.065L15.387 24l5.15-10.172h-3.066m-7.008-5.599l2.836 5.598h4.172L10.463 0l-7.93 15.705h4.174"/>
        </svg>
        <span>KẾT NỐI VỚI STRAVA</span>
      </button>

      <!-- Quick Link to Live Dashboard -->
      <a 
        href="/dashboard" 
        class="w-full py-3 px-4 bg-slate-800/90 hover:bg-slate-700/90 border border-slate-700/80 text-orange-400 hover:text-orange-300 font-bold text-xs rounded-xl flex items-center justify-center space-x-2 transition duration-200"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span>XEM BẢNG XẾP HẠNG & DASHBOARD LIVE</span>
      </a>

    </form>

    <!-- Footer Rules Note -->
    <div class="mt-8 pt-6 border-t border-slate-800/80 text-center text-xs text-slate-500 space-y-1">
      <p class="font-medium text-slate-400">🛡️ Quy định Pace giải IRIS: 4:00 - 15:00 min/km</p>
      <p>Thời gian diễn ra: 00:00 03/08/2026 ➔ 23:59 30/08/2026</p>
    </div>

  </div>

</body>
</html>
